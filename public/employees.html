<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ice HR - Employees</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Employees</h1>
  <div id="message" hidden></div>
  <form class="card filters" id="filters">
    <div style="flex:2"><label for="search">Search</label><input id="search" name="search" placeholder="Name or email"></div>
    <div><label for="departmentId">Department</label><select id="departmentId" name="departmentId"></select></div>
    <div><label for="status">Status</label>
      <select id="status" name="status"><option value="">Any</option><option>ACTIVE</option><option>TERMINATED</option></select></div>
    <div><label for="sort">Sort by</label>
      <select id="sort" name="sort">
        <option value="id,asc">Id</option><option value="lastName,asc">Last name</option>
        <option value="hireDate,desc">Newest hires</option><option value="salary,desc">Highest salary</option>
      </select></div>
    <div><button type="submit">Search</button></div>
    <div><a class="btn secondary" href="/employee?new=1">Add employee</a></div>
  </form>
  <div class="table-wrap"><table>
    <thead><tr><th>Id</th><th>Name</th><th>Email</th><th>Job</th><th>Department</th><th class="num">Salary</th><th>Hired</th><th>Status</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="pager"><button type="button" class="secondary small" id="prev">Previous</button><span id="page-info"></span><button type="button" class="secondary small" id="next">Next</button></div>
</main>
<script src="/app.js"></script>
<script>
  header("employees");
  let page = 0, jobs = {}, depts = {};
  const form = document.getElementById("filters");

  async function load() {
    clearMessage();
    const p = new URLSearchParams({ page, size: 20, sort: form.sort.value });
    for (const f of ["search", "departmentId", "status"]) if (form[f].value) p.set(f, form[f].value);
    try {
      const r = await api("GET", "/employees?" + p);
      document.getElementById("rows").innerHTML = r.content.map((e) => `<tr>
        <td>${e.id}</td><td><a href="/employee?id=${e.id}">${esc(e.firstName)} ${esc(e.lastName)}</a></td><td>${esc(e.email)}</td>
        <td>${esc(jobs[e.jobId])}</td><td>${esc(depts[e.departmentId])}</td><td class="num">${money(e.salary)}</td>
        <td>${esc(e.hireDate)}</td><td>${badge(e.status)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No employees match.</td></tr>`;
      document.getElementById("page-info").textContent = `Page ${r.page + 1} of ${Math.max(r.totalPages, 1)} (${r.totalElements} employees)`;
      document.getElementById("prev").disabled = r.page === 0;
      document.getElementById("next").disabled = r.page + 1 >= r.totalPages;
    } catch (e) { showMessage("error", e); }
  }

  form.addEventListener("submit", (ev) => { ev.preventDefault(); page = 0; load(); });
  document.getElementById("prev").addEventListener("click", () => { page--; load(); });
  document.getElementById("next").addEventListener("click", () => { page++; load(); });

  (async () => {
    try {
      const [j, d] = await Promise.all([api("GET", "/jobs"), fillSelect(form.departmentId, "/departments", (d) => d.name, { blank: "All" })]);
      j.forEach((x) => (jobs[x.id] = x.title));
      d.forEach((x) => (depts[x.id] = x.name));
      if (qs("departmentId")) form.departmentId.value = qs("departmentId");
      load();
    } catch (e) { showMessage("error", e); }
  })();
</script>
</body>
</html>
