<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ice HR - Leave requests</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>Leave requests</h1>
  <div id="message" hidden></div>

  <form class="card" id="new-form" novalidate>
    <h2>Request leave</h2>
    <div class="grid">
      <div><label for="employeeId">Employee id</label><input id="employeeId" name="employeeId" data-type="int" inputmode="numeric"></div>
      <div><label for="type">Type</label><select id="type" name="type"><option>VACATION</option><option>SICK</option><option>PERSONAL</option></select></div>
      <div><label for="startDate">First day</label><input id="startDate" name="startDate" type="date"></div>
      <div><label for="endDate">Last day</label><input id="endDate" name="endDate" type="date"></div>
      <div style="grid-column: 1 / -1"><label for="reason">Reason (optional)</label><input id="reason" name="reason" data-optional="1" maxlength="250"></div>
    </div>
    <p class="hint">Days are counted Monday to Friday. Allowance per year: VACATION 20, SICK 10, PERSONAL 3.</p>
    <div class="actions"><button type="submit">Submit request</button></div>
  </form>

  <form class="card filters" id="filters">
    <div><label for="f-status">Status</label>
      <select id="f-status" name="status"><option value="">Any</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option><option>CANCELLED</option></select></div>
    <div><label for="f-employee">Employee id</label><input id="f-employee" name="employeeId" inputmode="numeric"></div>
    <div><button type="submit">Filter</button></div>
  </form>

  <div class="table-wrap"><table>
    <thead><tr><th>Id</th><th>Employee</th><th>Type</th><th>From</th><th>To</th><th class="num">Days</th><th>Status</th><th>Decided by</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div class="pager"><button type="button" class="secondary small" id="prev">Previous</button><span id="page-info"></span><button type="button" class="secondary small" id="next">Next</button></div>
</main>

<dialog id="decide-dialog">
  <form method="dialog" id="decide-form">
    <h2 id="decide-title">Decide</h2>
    <label for="approverId">Your employee id (the manager, or an HR Manager)</label>
    <input id="approverId" inputmode="numeric">
    <div id="reason-wrap"><label for="decide-reason" style="margin-top:10px">Reason for rejecting</label><input id="decide-reason" maxlength="250"></div>
    <div class="actions"><button type="submit" value="ok">Confirm</button><button type="submit" value="cancel" class="secondary">Cancel</button></div>
  </form>
</dialog>

<script src="/app.js"></script>
<script>
  header("leave");
  const filters = document.getElementById("filters");
  const newForm = document.getElementById("new-form");
  let page = 0, names = {};

  async function employeeName(id) {
    if (!(id in names)) {
      try { const e = await api("GET", `/employees/${id}`); names[id] = `${e.firstName} ${e.lastName}`; } catch { names[id] = `#${id}`; }
    }
    return names[id];
  }

  async function load() {
    const p = new URLSearchParams({ page, size: 20, sort: "id,desc" });
    if (filters.status.value) p.set("status", filters.status.value);
    if (filters.employeeId.value.trim()) p.set("employeeId", filters.employeeId.value.trim());
    try {
      const r = await api("GET", "/leave-requests?" + p);
      const rows = [];
      for (const l of r.content) {
        const acts = l.status === "PENDING"
          ? `<button type="button" class="small" data-act="approve" data-id="${l.id}">Approve</button> <button type="button" class="small danger" data-act="reject" data-id="${l.id}">Reject</button> `
          : "";
        const cancel = l.status === "PENDING" || l.status === "APPROVED" ? `<button type="button" class="small secondary" data-act="cancel" data-id="${l.id}">Cancel</button>` : "";
        rows.push(`<tr><td>${l.id}</td><td><a href="/employee?id=${l.employeeId}">${esc(await employeeName(l.employeeId))}</a></td><td>${l.type}</td>
          <td>${l.startDate}</td><td>${l.endDate}</td><td class="num">${l.days}</td><td>${badge(l.status)}</td>
          <td>${l.approverId ?? ""}${l.decisionReason ? ` <span class="muted" title="${esc(l.decisionReason)}">(${esc(l.decisionReason)})</span>` : ""}</td><td>${acts}${cancel}</td></tr>`);
      }
      document.getElementById("rows").innerHTML = rows.join("") || `<tr><td colspan="9" class="muted">No leave requests match.</td></tr>`;
      document.getElementById("page-info").textContent = `Page ${r.page + 1} of ${Math.max(r.totalPages, 1)} (${r.totalElements} requests)`;
      document.getElementById("prev").disabled = r.page === 0;
      document.getElementById("next").disabled = r.page + 1 >= r.totalPages;
    } catch (e) { showMessage("error", e); }
  }

  filters.addEventListener("submit", (ev) => { ev.preventDefault(); page = 0; clearMessage(); load(); });
  document.getElementById("prev").addEventListener("click", () => { page--; load(); });
  document.getElementById("next").addEventListener("click", () => { page++; load(); });

  newForm.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    clearMessage();
    try {
      const l = await api("POST", "/leave-requests", formData(newForm));
      showMessage("ok", `Leave request ${l.id} created for ${l.days} day(s). It is waiting for the manager.`);
      page = 0; load();
    } catch (e) { showMessage("error", e); }
  });

  const dialog = document.getElementById("decide-dialog");
  let pending = null;
  document.getElementById("rows").addEventListener("click", async (ev) => {
    const { act, id } = ev.target.dataset;
    if (!act) return;
    clearMessage();
    if (act === "cancel") {
      if (!confirm(`Cancel leave request ${id}?`)) return;
      try { await api("POST", `/leave-requests/${id}/cancel`); showMessage("ok", `Leave request ${id} cancelled.`); load(); }
      catch (e) { showMessage("error", e); }
      return;
    }
    pending = { act, id };
    document.getElementById("decide-title").textContent = `${act === "approve" ? "Approve" : "Reject"} leave request ${id}`;
    document.getElementById("reason-wrap").hidden = act !== "reject";
    document.getElementById("decide-reason").value = "";
    dialog.showModal();
  });
  dialog.addEventListener("close", async () => {
    if (dialog.returnValue !== "ok" || !pending) return;
    const raw = document.getElementById("approverId").value.trim();
    const body = { approverId: /^\d+$/.test(raw) ? Number(raw) : raw || undefined };
    if (pending.act === "reject") body.reason = document.getElementById("decide-reason").value;
    try { await api("POST", `/leave-requests/${pending.id}/${pending.act}`, body); showMessage("ok", `Leave request ${pending.id} ${pending.act === "approve" ? "approved" : "rejected"}.`); load(); }
    catch (e) { showMessage("error", e); }
  });

  if (qs("employeeId")) { newForm.employeeId.value = qs("employeeId"); filters.employeeId.value = qs("employeeId"); }
  load();
</script>
</body>
</html>
