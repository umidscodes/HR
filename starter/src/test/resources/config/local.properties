# Ice HR on your own machine (npm run dev in the repository root).
# Nothing here is secret: these values are in the Ice HR README.
# Override any key without editing this file, for example:
#   mvn test -DbaseUrl=http://localhost:8081

# The app. The REST API lives under /api/v1.
baseUrl=http://localhost:8080

# Database. qa_reader can only read; qa_writer can also INSERT, UPDATE and DELETE.
jdbcUrl=jdbc:postgresql://localhost:5434/icehr
dbUser=qa_reader
dbPassword=qa_reader
dbWriterUser=qa_writer
dbWriterPassword=qa_writer
